# Paquete de despliegue para Azure App Service (Linux, NODE:22-lts).
#
# La build standalone se hace aquí y no en Windows: en Windows falla con
# `EPERM symlink` y los binarios nativos (better-sqlite3) tienen que ser de
# Linux. Este job NO despliega: deja el zip como artefacto y el despliegue se
# hace a mano (ver docs/DESPLIEGUE-V1.md, "Paquete del despliegue").
name: paquete-azure

on:
  workflow_dispatch:
  push:
    branches: [feat/v1-unificada, develop]

permissions:
  contents: read

jobs:
  paquete:
    # 22.04 y no latest: glibc 2.35, compatible con la imagen Node 22 de App Service.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar (lockfile de la raíz)
        run: npm ci

      # El lockfile se genera en Windows y npm omite los binarios opcionales de
      # otras plataformas (npm/cli#4828). Rollup y esbuild son de vitest (no van
      # al paquete); se instalan los de Linux con la versión exacta ya resuelta.
      - name: Binarios de Linux de las herramientas de test
        run: |
          RV=$(node -p "require('rollup/package.json').version")
          EV=$(node -p "require('esbuild/package.json').version")
          npm install --no-save --no-package-lock "@rollup/rollup-linux-x64-gnu@$RV" "@esbuild/linux-x64@$EV"

      - name: Tipos y tests
        working-directory: apps/web
        run: |
          npx tsc --noEmit -p .
          npm test

      - name: Build standalone
        env:
          NEXT_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --workspace apps/web run build

      - name: Armar el paquete
        run: |
          set -euo pipefail
          S=apps/web/.next/standalone
          # standalone no copia ni los estáticos ni public/.
          cp -r apps/web/.next/static "$S/apps/web/.next/static"
          if [ -d apps/web/public ]; then cp -r apps/web/public "$S/apps/web/public"; fi
          mkdir -p "$S/apps/web/scripts"
          cp apps/web/scripts/verificar-paquete.mjs "$S/apps/web/scripts/"
          cp apps/web/start-standalone.sh "$S/start.sh"
          chmod +x "$S/start.sh"
          # Los enlaces simbólicos (el propio workspace @zelena/web) no sobreviven
          # al unzip de Kudu y la app no los usa: se listan y se quitan.
          echo "Enlaces simbólicos en el bundle:"; find "$S" -type l -print
          find "$S" -type l -delete
          node "$S/apps/web/scripts/verificar-paquete.mjs" "$S/apps/web"
          # El repo es público y el paquete no debe llevar entornos, bases ni llaves.
          prohibidos=$(find "$S" \( -name '.env*' -o -name '*.db' -o -name '*.db-*' -o -name '*.secret' \) -print)
          if [ -n "$prohibidos" ]; then echo "Archivos que no pueden ir en el paquete:"; echo "$prohibidos"; exit 1; fi
          (cd "$S" && zip -qr "$GITHUB_WORKSPACE/paquete-azure.zip" .)
          ls -la paquete-azure.zip
          echo "BUILD_ID: $(cat apps/web/.next/BUILD_ID)"

      # Ensayo en Linux del MISMO zip que se va a subir, sobre una base con el
      # esquema que hoy corre en producción (fixture del 58ee2fd): arranca con
      # start.sh, migra y responde. Si algo falla, no hay artefacto.
      - name: Ensayo del paquete (base con el esquema desplegado)
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/ensayo"; mkdir -p "$E/app" "$E/data"
          unzip -q paquete-azure.zip -d "$E/app"
          node -e "const {DatabaseSync}=require('node:sqlite');const fs=require('fs');new DatabaseSync(process.argv[1]).exec(fs.readFileSync(process.argv[2],'utf8'))" "$E/data/zelena.db" apps/web/src/lib/__fixtures__/schema-58ee2fd.sql
          export DATABASE_FILE="$E/data/zelena.db" DATABASE_DRIVER=sqlite PORT=8080 NODE_ENV=production
          export SESSION_SECRET="$(openssl rand -hex 32)" FOUNDER_WALLET=GA7ZELENAFOUNDERDEMOWALLET000000000000000000000000000AAA
          sh "$E/app/start.sh" > "$E/server.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8080/api/cla && break; sleep 1; done
          falla() { echo "FALLA: $1"; tail -80 "$E/server.log"; exit 1; }
          for p in / /manifiesto /encuentros /empresas /empresas/servicios /ecosistema /agora /academia /gobernanza /whitepaper /entrar; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$p"); echo "$p $c"; [ "$c" = 200 ] || falla "$p respondió $c"
          done
          for p in /equipo/hoy /admin /perfil /clientes; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$p"); echo "$p $c"; [ "$c" = 307 ] || falla "$p respondió $c sin sesión"
          done
          curl -s http://127.0.0.1:8080/api/cla | grep -q 03293c9378146cbd || falla "hash del CLA distinto"
          echo "--- log del servidor"; tail -40 "$E/server.log"

      - uses: actions/upload-artifact@v4
        with:
          name: paquete-azure
          path: paquete-azure.zip
          retention-days: 14
